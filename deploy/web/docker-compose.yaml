name: travel-agent-web

x-firecrawl-common: &firecrawl-common
  build:
    context: https://github.com/firecrawl/firecrawl.git#v1.7.0:apps/api
  restart: unless-stopped
  environment: &firecrawl-environment
    REDIS_URL: redis://valkey:6379
    REDIS_RATE_LIMIT_URL: redis://valkey:6379
    PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
    SEARXNG_ENDPOINT: http://searxng:8080
    SEARXNG_ENGINES: bing
    SEARXNG_CATEGORIES: general
    USE_DB_AUTHENTICATION: "false"
    ENV: local
    LOGGING_LEVEL: info
  depends_on:
    valkey:
      condition: service_healthy
    playwright-service:
      condition: service_started
    searxng:
      condition: service_healthy
  networks:
    - private

services:
  searxng:
    image: ghcr.io/searxng/searxng@sha256:3aed6b4bfb4e6a2b3b94c890dafb3f35cb2588493b83818434aa260e8bdeb4d4
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in an untracked env file}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - private

  valkey:
    image: ghcr.io/valkey-io/valkey@sha256:d827e7f7552cdee40cc7482dbae9da020f42bc47669af6f71182a4ef76a22773
    restart: unless-stopped
    command: ["valkey-server", "--bind", "0.0.0.0", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - private

  playwright-service:
    build:
      context: https://github.com/firecrawl/firecrawl.git#v1.7.0:apps/playwright-service-ts
    restart: unless-stopped
    environment:
      PORT: "3000"
      BLOCK_MEDIA: "true"
    networks:
      - private

  firecrawl-api:
    <<: *firecrawl-common
    environment:
      <<: *firecrawl-environment
      HOST: 0.0.0.0
      PORT: "3002"
      FLY_PROCESS_GROUP: app
    command: ["pnpm", "run", "start:production"]
    ports:
      - "127.0.0.1:3002:3002"

  firecrawl-worker:
    <<: *firecrawl-common
    environment:
      <<: *firecrawl-environment
      FLY_PROCESS_GROUP: worker
    command: ["pnpm", "run", "worker:production"]
    depends_on:
      firecrawl-api:
        condition: service_started
      valkey:
        condition: service_healthy
      playwright-service:
        condition: service_started
      searxng:
        condition: service_healthy

networks:
  private:
    internal: false
