use_default_settings:
  engines:
    keep_only:
      - google
      - bing

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: go
    categories: [general]
    inactive: false
    disabled: false
  - name: bing
    engine: bing
    shortcut: bi
    categories: [general]
    base_url: https://cn.bing.com
    disabled: false

ui:
  static_use_hash: true
