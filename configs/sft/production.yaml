validation_note: >-
  The immutable synthetic dev contains query-only Train Search coverage cases and no
  assistant labels. It is evaluated interactively and cannot yield supervised loss.
learning_rate_basis: >-
  A 320-example, 40-step Agent smoke comparison found 1e-4 over-aggressive for
  native tool-call/final-answer balance. The 2e-5 run preserved legal tool calls,
  reduced malformed output to zero at step 40, and is used unchanged in production.
memory_strategy_note: >-
  The required 32768-token shape passed with sequence_parallel_size=4 and ZeRO-3 CPU
  offload while GPU 0 retained an external 4.5 GiB allocation. The immutable 881-row
  corpus has a measured maximum of 7401 tokens, so production uses faster four-rank
  DDP; max_length remains 32768 and no example is truncated.
