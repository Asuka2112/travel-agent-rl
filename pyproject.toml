[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent-rl"
version = "0.1.0"
description = "Auditable long-horizon travel agent post-training pipeline"
requires-python = ">=3.10,<3.11"
dependencies = [
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "rapidfuzz==3.14.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: cross-component tests",
  "gpu: requires an explicitly allocated GPU",
]

[tool.ruff]
line-length = 100
target-version = "py310"
